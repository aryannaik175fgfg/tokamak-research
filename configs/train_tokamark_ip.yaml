device: auto
amp: true

dataset:
  task: ip_regression
  tokamark_robustness_path: data/tokamark_subset
  itpa_globals_path: data/itpa/HDB5V2.3.xlsx
  label_file: y
  patch_len: 8
  time_stride: 49
  # RTX 3050 6GB: batch 256 ~= 4.0 GB reserved; 288 ~= 4.6 GB (OOM risk if other GPU users)
  batch_size: 256
  num_workers: 2

model:
  d_model: 256
  n_layers: 6
  n_heads: 8
  mlp_ratio: 4.0
  patch_len: 8
  n_reactor_ctx: 4
  n_rho: 32

optim:
  # Scaled ~sqrt(256/8) from the original 3e-4 @ batch 8
  lr: 1.6e-3
  encoder_lr_scale: 0.1
  weight_decay: 0.01
  epochs: 60
  early_stop_patience: 8
  stage1_checkpoint: runs/stage1_mhd/stage1_last.pt

flags:
  use_mhd_pretrain: false
  use_itpa_conditioning: true

log:
  checkpoint_dir: runs/stage2_ip
  metrics_csv: metrics.csv
  train_log: train.log